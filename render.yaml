# Render Blueprint for the Rayon Sports FC site.
# Render reads this file when you create a Blueprint from the repo
# (Dashboard -> New -> Blueprint) and redeploys on every push to main.
#
# The app is TanStack Start with server-side rendering, so it runs as a Node.js
# web service. Lovable's build preset targets Cloudflare Workers by default;
# NITRO_PRESET=node-server makes it build a plain Node server instead.

services:
  - type: web
    name: rayon-sports-fc
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # Bun is pinned through npx so installs follow bun.lock exactly.
    buildCommand: npx --yes bun@1.4.2 install --frozen-lockfile && npx --yes bun@1.4.2 run build
    # --env-file-if-exists loads the Supabase settings from the committed .env;
    # anything set in the Render dashboard takes precedence.
    startCommand: node --env-file-if-exists=.env .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: 0.0.0.0
      # Optional: live league table from api-football. Without it the site
      # shows its stored league data.
      - key: API_FOOTBALL_KEY
        sync: false
